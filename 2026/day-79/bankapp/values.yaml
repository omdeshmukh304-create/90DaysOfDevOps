# BankApp Configuration
bankapp:
  replicaCount: 4

  image:
    repository: trainwithshubham/ai-bankapp-eks
    tag: "1c7cb0e"
    pullPolicy: Always

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  service:
    type: ClusterIP
    port: 8080

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 70

# MySQL Configuration
mysql:
  enabled: true

  image:
    repository: mysql
    tag: "8.0"

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  persistence:
    size: 5Gi
    storageClass: gp3

# Ollama Configuration
ollama:
  enabled: true

  image:
    repository: ollama/ollama
    tag: "latest"

  model: tinyllama

  resources:
    requests:
      memory: "2Gi"
      cpu: "900m"
    limits:
      memory: "2.5Gi"
      cpu: "1500m"

  persistence:
    size: 10Gi
    storageClass: gp3

# ConfigMap Values
config:
  mysqlDatabase: bankappdb
  ollamaUrl: ""

# Secret Values
secrets:
  mysqlRootPassword: Test@123
  mysqlUser: root
  mysqlPassword: Test@123

# StorageClass
storageClass:
  create: true
  name: gp3
  provisioner: ebs.csi.aws.com

# Gateway (Future Use)
gateway:
  enabled: false
  hostname: ""

  tls:
    enabled: false
