apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
spec:
  containers:
  - name: busybox-container
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - touch /tmp/healthy;
        sleep 30;
        rm -f /tmp/healthy;
        sleep 600;
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3